<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>氏名検索</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow p-4">

        <h1 class="mb-4">
            氏名検索
        </h1>

        <form method="get">

            <div class="input-group mb-4">

                <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder="氏名を入力"
                    value="{{ keyword }}"
                >

                <button class="btn btn-primary">
                    検索
                </button>

            </div>

        </form>

        {% if results %}

        <table class="table table-striped">

            <thead>

                <tr>
                    <th>氏名</th>
                    <th>借方金額</th>
                    <th>摘要</th>
                </tr>

            </thead>

            <tbody>

                {% for row in results %}

                <tr>

                    <td>{{ row.name }}</td>

                    <td>{{ "{:,}".format(row.debit) }} 円</td>

                    <td>{{ row.description }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

        {% endif %}

    </div>

</div>

</body>
</html>
