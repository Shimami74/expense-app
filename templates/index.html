```html
<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>経費PDF集計</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <h1 class="text-center mb-4">
                            経費PDF集計
                        </h1>

                        <form
                            id="upload-form"
                            action="/upload"
                            method="post"
                            enctype="multipart/form-data"
                        >

                            <!-- ドラッグ＆ドロップエリア -->
                            <div
                                id="drop-area"
                                class="border border-3 border-primary rounded-4 p-5 text-center bg-white"
                                style="cursor:pointer;"
                            >

                                <p class="fs-5 mb-3">
                                    PDFをドラッグ＆ドロップ
                                </p>

                                <p class="text-muted">
                                    またはクリックして選択
                                </p>

                                <input
                                    type="file"
                                    name="pdf"
                                    id="fileElem"
                                    accept=".pdf"
                                    class="d-none"
                                    required
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-primary mt-3"
                                    onclick="document.getElementById('fileElem').click()"
                                >
                                    ファイル選択
                                </button>

                                <div
                                    id="file-name"
                                    class="mt-3 text-success"
                                ></div>

                            </div>

                            <!-- 集計ボタン -->
                            <div class="d-grid mt-4">

                                <button
                                    id="submit-btn"
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                >
                                    集計開始
                                </button>

                            </div>

                        </form>

                        <!-- 結果表示 -->
                        {% if result %}

                        <hr class="my-4">

                        <div class="alert alert-success">

                            <h4 class="mb-3">
                                集計完了
                            </h4>

                            <p>
                                抽出件数:
                                <strong>{{ result.total_rows }}</strong>
                            </p>

                            <p>
                                氏名未抽出:
                                <strong>{{ result.unknown_count }}</strong>
                            </p>

                            <p>
                                借方合計:
                                <strong>{{ result.total_amount }} 円</strong>
                            </p>

                            <a
                                href="/download/{{ result.download_file }}"
                                class="btn btn-success mt-3"
                            >
                                Excelダウンロード
                            </a>

                        </div>

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script>

        const dropArea = document.getElementById("drop-area");

        const fileInput = document.getElementById("fileElem");

        const fileName = document.getElementById("file-name");

        // クリックでファイル選択
        dropArea.addEventListener("click", () => {

            fileInput.click();

        });

        // ファイル選択時
        fileInput.addEventListener("change", () => {

            showFileName(fileInput.files);

        });

        // ドラッグ中
        dropArea.addEventListener("dragover", (e) => {

            e.preventDefault();

            dropArea.classList.add("bg-light");

        });

        // ドラッグ離脱
        dropArea.addEventListener("dragleave", () => {

            dropArea.classList.remove("bg-light");

        });

        // ドロップ時
        dropArea.addEventListener("drop", (e) => {

            e.preventDefault();

            dropArea.classList.remove("bg-light");

            fileInput.files = e.dataTransfer.files;

            showFileName(fileInput.files);

        });

        // ファイル名表示
        function showFileName(files) {

            if (files.length > 0) {

                fileName.innerHTML =
                    "選択ファイル: <strong>" + files[0].name + "</strong>";

            }

        }

        // ローディング表示
        const form = document.getElementById("upload-form");

        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", () => {

            submitBtn.disabled = true;

            submitBtn.innerHTML = `
                <span class="spinner-border spinner-border-sm"></span>
                処理中...
            `;

        });

    </script>

</body>

</html>
```
